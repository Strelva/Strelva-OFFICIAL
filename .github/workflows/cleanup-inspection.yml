name: Cleanup transfer

on:
  push:
    branches: [refactor/domain-cleanup-20260922]

permissions:
  contents: write

concurrency:
  group: strelva-domain-cleanup-transfer
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Strelva/Strelva-OFFICIAL'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified cleanup and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          encoded = ''.join(Path(f'.cleanup-transfer/part-{i}').read_text() for i in range(4))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          expected = 'bd3ad66a95db14c3878bbec952e7e98bdcb93c825ea436c9165dabf718cc388c'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Cleanup patch integrity check failed')
          (Path(os.environ['RUNNER_TEMP']) / 'strelva-cleanup.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/strelva-cleanup.patch"
          git apply --index "$RUNNER_TEMP/strelva-cleanup.patch"
          git rm -r -- .cleanup-transfer .github/workflows/cleanup-inspection.yml
          git rm -- src/app/admin/CommandTrigger.tsx src/app/admin/CreateTenantForm.tsx src/app/admin/InviteButton.tsx
          git rm -- src/components/dashboard/AgentPreview.tsx src/components/dashboard/AgentTrace.tsx src/components/dashboard/LayoutPanel.tsx
          git diff --cached --check
          test "$(git write-tree)" = '7f52771af2bef075b46fb22875f2a4c75fa88aac'
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate application domain and remove unused UI'
          git push origin HEAD:refs/heads/refactor/domain-cleanup-20260922
