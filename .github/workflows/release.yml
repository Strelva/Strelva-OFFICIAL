name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. reb-v2026.05.02.1"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        run: |
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}
