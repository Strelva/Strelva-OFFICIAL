name: CI

on:
  push:
    branches: [main]
    # Docs/markdown-only changes don't need the full build+smoke — save Actions minutes.
    paths-ignore: ["**.md", "docs/**", ".vscode/**", "LICENSE"]
  # Oct 7, 2026 (Jacob): PR CI runs only for PRs into main, the release gate.
  # Integration PRs (into integrate/*) are gated by local checks; run this
  # workflow by hand from the Actions tab (workflow_dispatch) when wanted.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", ".vscode/**", "LICENSE"]
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same branch/PR. This is the
# single biggest Actions-minutes saver during active development: without it, every
# push starts a fresh ~6-min build while the previous one keeps running to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Product boundaries
        run: pnpm check:boundaries

      - name: Motion ladder
        run: pnpm check:motion

      - name: Screen words
        run: pnpm check:words

      - name: Ontology invariants
        run: pnpm check:ontology

      - name: PostgreSQL 18 client and server (local SQL proofs are qualified on 18)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-18 redis-server
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Install ripgrep (check scripts use rg)
        run: command -v rg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)

      - name: Qualify PostgreSQL 18 tools
        run: bash scripts/check-postgres-tools.sh >> "$GITHUB_PATH"

      - name: Release gate policy regressions
        run: node --test scripts/tests/release-gate-ci.node-test.mjs scripts/tests/supply-chain.node-test.mjs scripts/tests/temp-postgres-env.node-test.mjs
      - name: Migration ordering
        run: pnpm check:migration-order

      - name: Workspace SQL and full ordered upgrade
        run: |
          pnpm check:workspace-sql
          pnpm check:workspace-upgrade

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Audit dependencies and supply-chain policy
        # Date-bounded development exception only; production HIGH+ always fails.
        run: pnpm check:supply-chain

      - name: Build
        run: pnpm build

      # Run browser gates on main pushes, manual runs, and ready PRs. Draft PRs
      # retain the inexpensive checks above; ready_for_review enables browsers.
      - name: Cache Playwright browsers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        # On a cache hit only install the OS deps (fast); the ~100MB chromium
        # download is restored from cache. On a miss, install both.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Smoke tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        # Runs against `next dev` (see playwright.config.ts), matching the
        # fixture-backed public/auth-gate route harness. It does not contact a
        # production provider. The webServer timeout is sized for cold
        # Turbopack compile on a CI runner.
        run: pnpm smoke

      - name: Workspace browser acceptance (fixture-backed)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        run: pnpm smoke:workspace
        env:
          CI: true
          SCAFFOLD_DEV_UNGATED_ACCESS: "0"
          REB_DEV_UNGATED_ACCESS: "0"

      - name: Surface smoke
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        # Ungated console coverage — needs the dev super-admin bypass ON
        # (REB_DEV_UNGATED_ACCESS=1 + REB_DEV_TENANT=gldf, set by smoke:surfaces) to
        # reach the /admin console and resolve the owner dashboard, whereas the public
        # smoke above runs with the bypass OFF.
        #
        # operator-surfaces.spec.ts (admin list surfaces) needs no backend at all.
        # owner-surfaces.spec.ts (owner dashboard + client cockpit) needs a tenant to
        # resolve, so we seed a SYNTHETIC gldf fixture (no real secrets) into the
        # dev-file tenant path first. Content comes from the committed
        # gldf-content-defaults; the operational stores stay empty and every assertion
        # is data-independent, so a broken page fails the build without any
        # DB/Redis/prod access. (Re-enabled once the `font-display` @utility replaced
        # the arbitrary `font-[family-name:...]` class that crashed Turbopack dev.)
        run: |
          fixture="dev-tenants.json"
          backup="$(mktemp)"
          had_fixture=0
          if [ -e "$fixture" ] || [ -L "$fixture" ]; then
            cp -a -- "$fixture" "$backup"
            had_fixture=1
          fi
          restore_fixture() {
            status=$?
            trap - EXIT INT TERM HUP
            set +e
            cleanup_status=0
            rm -f -- "$fixture" || cleanup_status=$?
            if [ "$had_fixture" -eq 1 ]; then
              cp -a -- "$backup" "$fixture" || cleanup_status=$?
            fi
            rm -f -- "$backup" || cleanup_status=$?
            if [ "$status" -eq 0 ] && [ "$cleanup_status" -ne 0 ]; then
              status="$cleanup_status"
            fi
            exit "$status"
          }
          trap restore_fixture EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          rm -f -- "$fixture"
          cp tests/fixtures/tenants.fixture.json "$fixture"
          pnpm smoke:surfaces
        env:
          CI: true
