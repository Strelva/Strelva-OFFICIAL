name: CI

on:
  push:
    branches: [main]
  # Run on EVERY pull request, not just those targeting main. Stacked PRs
  # (e.g. harden/* based on another harden/*) otherwise get zero CI — the gate
  # only fired once the whole stack reached main, so the intermediate PRs were
  # never enforced. No branch filter = every PR runs lint/typecheck/test/
  # coverage/build/audit/smoke before it can merge.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Audit dependencies
        # Fail only on actionable HIGH+ advisories. Plain `pnpm audit` fails on
        # ANY transitive moderate/low (mostly Sanity-CLI/build-tooling deps not
        # reachable in the production runtime), so it could never pass and kept
        # CI permanently red. High+ are patched via pnpm overrides.
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        # Runs against `next dev` (see playwright.config.ts). Dev mode is
        # deliberate: it tolerates a missing Clerk key (prod `next start` throws
        # "Missing publishableKey" with no auth env) and keeps the lenient
        # content/tenant dev-file fallbacks the public-route tests rely on. The
        # webServer timeout in playwright.config.ts is sized for cold Turbopack
        # compile on a CI runner.
        run: pnpm smoke
        env:
          CI: true
          SCAFFOLD_DEV_UNGATED_ACCESS: "0"
          REB_DEV_UNGATED_ACCESS: "0"

      - name: Operator surface smoke
        # Separate step because it needs the dev super-admin bypass ON
        # (REB_DEV_UNGATED_ACCESS=1, set by the smoke:surfaces script) to reach
        # the /admin console, whereas the public smoke above runs with it OFF.
        # tests/operator-surfaces.spec.ts is data-independent: it asserts every
        # admin list surface renders its header on this clean dev-file backend
        # (no DB/Redis/seeded tenant), so a broken operator page fails the build.
        # The tenant-detail cockpit + owner dashboard need a seeded fixture and
        # stay in the local ungated suite, not CI.
        run: pnpm smoke:surfaces
        env:
          CI: true
