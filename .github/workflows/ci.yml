name: CI

on:
  push:
    branches: [main]
  # Run on EVERY pull request, not just those targeting main. Stacked PRs
  # (e.g. harden/* based on another harden/*) otherwise get zero CI — the gate
  # only fired once the whole stack reached main, so the intermediate PRs were
  # never enforced. No branch filter = every PR runs lint/typecheck/test/
  # coverage/build/audit/smoke before it can merge.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Audit dependencies
        # Fail only on actionable HIGH+ advisories. Plain `pnpm audit` fails on
        # ANY transitive moderate/low (mostly Sanity-CLI/build-tooling deps not
        # reachable in the production runtime), so it could never pass and kept
        # CI permanently red. High+ are patched via pnpm overrides.
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        # Runs against `next dev` (see playwright.config.ts). Dev mode is
        # deliberate: it tolerates a missing Clerk key (prod `next start` throws
        # "Missing publishableKey" with no auth env) and keeps the lenient
        # content/tenant dev-file fallbacks the public-route tests rely on. The
        # webServer timeout in playwright.config.ts is sized for cold Turbopack
        # compile on a CI runner.
        run: pnpm smoke
        env:
          CI: true
          SCAFFOLD_DEV_UNGATED_ACCESS: "0"
          REB_DEV_UNGATED_ACCESS: "0"

      # NOTE: the ungated "Surface smoke" (operator-surfaces / owner-surfaces via
      # `pnpm smoke:surfaces` + the tenants fixture) is intentionally NOT wired here
      # yet. It exercises the /admin console pages, and on a cold CI runner Turbopack
      # DEV mis-serializes the `font-[family-name:var(--font-display)]` arbitrary
      # class in globals.css (RSC payload bleeds into the CSS parse), crashing the
      # dev webServer before the tests run. `pnpm build` (prod) compiles it fine, and
      # the ungated bypass requires NODE_ENV!=production so `next start` can't be used
      # instead. The specs + fixture ship and run locally (`pnpm smoke:surfaces`);
      # wiring them into CI is deferred behind fixing that Turbopack dev-CSS bug.
