name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Audit dependencies
        # Fail only on actionable HIGH+ advisories. Plain `pnpm audit` fails on
        # ANY transitive moderate/low (mostly Sanity-CLI/build-tooling deps not
        # reachable in the production runtime), so it could never pass and kept
        # CI permanently red. High+ are patched via pnpm overrides.
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm smoke
        env:
          CI: true
          SCAFFOLD_DEV_UNGATED_ACCESS: "0"
          REB_DEV_UNGATED_ACCESS: "0"
