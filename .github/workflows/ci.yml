name: CI

on:
  push:
    branches: [main]
  # Run on EVERY pull request, not just those targeting main. Stacked PRs
  # (e.g. harden/* based on another harden/*) otherwise get zero CI — the gate
  # only fired once the whole stack reached main, so the intermediate PRs were
  # never enforced. No branch filter = every PR runs lint/typecheck/test/
  # coverage/build/audit/smoke before it can merge.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Audit dependencies
        # Fail only on actionable HIGH+ advisories. Plain `pnpm audit` fails on
        # ANY transitive moderate/low (mostly Sanity-CLI/build-tooling deps not
        # reachable in the production runtime), so it could never pass and kept
        # CI permanently red. High+ are patched via pnpm overrides.
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        # Smoke the BUILT app (next start against the .next produced by the Build
        # step above), not a cold `next dev`. Cold Turbopack compile-on-first-
        # request raced the Playwright webServer 120s timeout on CI runners and
        # flaked the whole job; the built app boots in ~1s. PLAYWRIGHT_BUILT_APP=1
        # flips playwright.config.ts to `next start`.
        run: pnpm smoke
        env:
          CI: true
          SCAFFOLD_DEV_UNGATED_ACCESS: "0"
          REB_DEV_UNGATED_ACCESS: "0"
          PLAYWRIGHT_BUILT_APP: "1"
