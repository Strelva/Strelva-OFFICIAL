name: CodeQL

on:
  # Was push+PR on every change, but analyze runs with `upload: never` (code
  # scanning isn't enabled in repo settings), so per-event runs burned ~3 Actions
  # minutes producing nothing usable. Weekly schedule only until scanning is turned
  # on — then restore `push`/`pull_request` (and flip `upload:` below) in one edit.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        # Enable code scanning in GitHub repository settings before turning uploads back on.
        with:
          upload: never
