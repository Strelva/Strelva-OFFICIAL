name: Assemble reviewed UI changes
on:
  push:
    branches: ['feat/self-service-experience-20260922']
    paths:
      - '.github/workflows/ui-integration-once.yml'
      - 'scripts/.ui-integration-*.json'
permissions:
  contents: read
concurrency:
  group: ui-integration-once-195
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'Strelva/Strelva-OFFICIAL' && github.ref == 'refs/heads/feat/self-service-experience-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply final four checksum-verified fixes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          branch = 'feat/self-service-experience-20260922'
          root = pathlib.Path.cwd().resolve()
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          expected = os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD') == expected
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == expected
          bundle = pathlib.Path('scripts/.ui-integration-0.json')
          raw = bundle.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'cda6d9476e38e167dd97a23b60b20c155e5541c006073ef69c8f7a0f9a2a4c8b'
          entries = json.loads(raw)
          assert len(entries) == 4
          prepared = []
          seen = set()
          for entry in entries:
              path = pathlib.PurePosixPath(entry['path'])
              assert path.parts[0] == 'src' and not path.is_absolute()
              assert not any(part in ('.', '..') for part in path.parts)
              assert str(path) not in seen
              seen.add(str(path))
              target = root.joinpath(*path.parts)
              assert root in target.resolve().parents
              assert not any(parent.is_symlink() for parent in [target, *target.parents])
              before = target.read_text(encoding='utf-8')
              assert hashlib.sha256(before.encode()).hexdigest() == entry['before'], str(path) + ' changed'
              end_previous = 0
              for start, end, text in entry['edits']:
                  assert type(start) is int and type(end) is int and end_previous <= start <= end <= len(before)
                  assert isinstance(text, str)
                  end_previous = end
              after = before
              for start, end, text in reversed(entry['edits']): after = after[:start] + text + after[end:]
              assert hashlib.sha256(after.encode()).hexdigest() == entry['after']
              prepared.append((target, after, str(path)))
          for target, after, name in prepared: target.write_text(after, encoding='utf-8')
          bundle.unlink()
          subprocess.run(['git', 'add', '--', *[name for _, _, name in prepared], str(bundle)], check=True)
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == expected
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'Preserve cleared intent and native onboarding boundaries'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          PY
