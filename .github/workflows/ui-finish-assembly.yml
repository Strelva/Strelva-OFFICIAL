name: Assemble reviewed UI fixes
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Strelva/Strelva-OFFICIAL' && github.event.pull_request.number == 195 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/self-service-experience-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply only the exact reviewed source edits
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch='feat/self-service-experience-20260922'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          rows = json.loads(pathlib.Path('.github/ui-finish-edits.json').read_text())
          pending = []
          seen = set()
          allowed = {'src/experience/workspace/WorkspaceApp.tsx', 'src/experience/workspace/WorkspaceOfferings.tsx'}
          for row in rows:
              name = row['path']
              path = pathlib.Path(name)
              if name in seen or '..' in path.parts or path.is_absolute() or path.is_symlink():
                  raise ValueError('Unexpected source path')
              if not (name in allowed or (name.startswith('tests/') and name.endswith('.spec.ts'))):
                  raise ValueError('Source outside this review')
              if not path.resolve().is_relative_to(root):
                  raise ValueError('Source outside repository')
              seen.add(name)
              before = path.read_bytes()
              if hashlib.sha256(before).hexdigest() == row['after']:
                  continue
              if hashlib.sha256(before).hexdigest() != row['before']:
                  raise ValueError('Source changed: ' + name)
              after = before
              boundary = len(before)
              for edit in sorted(row['edits'], key=lambda item: item['start'], reverse=True):
                  start, end = edit['start'], edit['end']
                  if not 0 <= start <= end <= boundary:
                      raise ValueError('Overlapping source edit')
                  after = after[:start] + edit['text'].encode() + after[end:]
                  boundary = start
              if hashlib.sha256(after).hexdigest() != row['after']:
                  raise ValueError('Reviewed result differs: ' + name)
              pending.append((path, after))
          for path, content in pending:
              path.write_bytes(content)
          if pending:
              subprocess.run(['git', 'add', '--', *[str(path) for path, _ in pending]], check=True)
          print('Exact source files applied:', len(pending))
          PY
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'Strelva UI review'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Complete loading safety and explicit application-view acceptance'
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD
