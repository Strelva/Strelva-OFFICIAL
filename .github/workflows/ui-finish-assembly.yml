name: Assemble reviewed app handoff fix
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Strelva/Strelva-OFFICIAL' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/native-app-handoff-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact reviewed app handoff source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch='fix/native-app-handoff-20260922'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          rows = json.loads(pathlib.Path('.github/ui-finish-edits.json').read_text())
          if len(rows) != 1:
              raise ValueError('Expected exactly one reviewed source file')
          row = rows[0]
          name = row['path']
          path = pathlib.Path(name)
          if name != 'src/experience/operations/BoundedWorkExperience.tsx' or path.is_symlink() or not path.resolve().is_relative_to(root):
              raise ValueError('Unexpected source path')
          before = path.read_bytes()
          if hashlib.sha256(before).hexdigest() != row['after']:
              if hashlib.sha256(before).hexdigest() != row['before']:
                  raise ValueError('Source changed before review')
              after = before
              boundary = len(before)
              for edit in sorted(row['edits'], key=lambda item: item['start'], reverse=True):
                  start, end = edit['start'], edit['end']
                  if not 0 <= start <= end <= boundary:
                      raise ValueError('Overlapping source edit')
                  after = after[:start] + edit['text'].encode() + after[end:]
                  boundary = start
              if hashlib.sha256(after).hexdigest() != row['after']:
                  raise ValueError('Reviewed result differs')
              path.write_bytes(after)
              subprocess.run(['git', 'add', '--', name], check=True)
          PY
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'Strelva UI review'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Wait for stable app identity before exposing lifecycle controls'
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD
