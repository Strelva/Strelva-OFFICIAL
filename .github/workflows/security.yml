name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the open-source gitleaks CLI directly (MIT, free). The
      # gitleaks/gitleaks-action wrapper now requires a paid license for org
      # accounts; the underlying tool does not. Scans full history against the
      # repo's .gitleaks.toml allowlist; non-zero exit on a finding fails the job.
      - name: Scan for secrets (gitleaks OSS)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --no-banner
