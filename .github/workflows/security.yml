name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      # Direct OSS CLI, MIT; no licensed org Action wrapper. The multi-platform
      # image is pinned to the upstream v8.30.1 registry manifest digest recorded
      # in scripts/supply-chain-policy.json. No scanner output/secret values leak.
      - name: Verify scanner/config detects fictional secret assignments
        run: node scripts/check-secrets.mjs --self-test
      - name: Scan full history with the immutable scanner
        run: node scripts/check-secrets.mjs
