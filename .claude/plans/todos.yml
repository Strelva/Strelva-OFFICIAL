  - id: domain-strategy
    title: "Decide and acquire domains: reb.studio + client subdomains"
    priority: P0
    feature: deployment
    status: todo
    context: |
      Architecture:
        reb.studio                    → REB agency landing page + Laney admin
        chelsea.reb.studio            → Chelsea's public site + dashboard
        [client].reb.studio           → future clients
        OR: clients get custom domains (rohlaxwellness.com) mapped via Vercel

      Options for domain:
        reb.studio (~$40/yr) — clean, tech, memorable
        reb.app — if available
        getreb.com — if .studio taken

      Check availability, buy through Vercel or Namecheap.
      Add wildcard DNS (*.reb.studio) for subdomain routing.
    source: "/strategy deployment"
    created: 2026-03-17

  - id: vercel-multi-project
    title: "Set up Vercel project for multi-tenant subdomain routing"
    priority: P0
    feature: deployment
    status: todo
    context: |
      Current: single Vercel project "rohlax-wellness" at rohlax-wellness.vercel.app
      Target: same codebase serves all clients via subdomain routing

      Steps:
        1. Add reb.studio domain to Vercel project
        2. Add wildcard *.reb.studio DNS
        3. Update middleware to extract tenant from subdomain
        4. Root domain (reb.studio) serves the REB agency landing page
        5. chelsea.reb.studio serves Chelsea's site + dashboard
        6. Environment: NEXT_PUBLIC_ROOT_DOMAIN=reb.studio

      Reference: Vercel Platforms starter kit pattern.
      The middleware already exists (tenant-middleware todo) — this is the infra setup.
    source: "/strategy deployment"
    created: 2026-03-17
    depends_on: [domain-strategy]

