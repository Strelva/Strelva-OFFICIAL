# REB Platform — Build Plan
# AI website management platform with modular capabilities
# Pivoted from agency model 2026-04-03
#
# Timeline: 8 weeks to graduation (May 2026)
# Status key: done, in-progress, todo

phases:

  # ═══════════════════════════════════════════════════════════
  # PHASE 1: Generalize from wellness-specific (Week 1)
  # ═══════════════════════════════════════════════════════════

  - id: generalize
    title: "Generalize from wellness-specific to universal"
    status: done
    done_at: 2026-04-03
    changes:
      - "schemas.ts: replaced hardcoded provider/shop/event category enums with z.string()"
      - "types.ts: ProviderItem.category, ShopItem.category, EventItem.hosted_by → string"
      - "types.ts: TemplateId extended with restaurant, trades, professional + string escape hatch"
      - "types.ts: TenantConfig gained ownerEmail, bookingProvider, bookingUrl, resendDomain fields"
      - "agent/route.ts: booking prompt uses tenantConfig.bookingProvider instead of hardcoded Vagaro"
      - "agent/route.ts: newsletter from-domain uses tenantConfig.resendDomain, fallback updates.reb.studio"
      - "registry.ts: template registry uses Record<string, TemplateDefinition>, added registerTemplate()"

  # ═══════════════════════════════════════════════════════════
  # PHASE 2: Database-backed tenant registry (Week 1-2)
  # ═══════════════════════════════════════════════════════════

  - id: db-tenants
    title: "Database-backed tenant registry"
    status: done
    done_at: 2026-04-03
    changes:
      - "tenants.ts: replaced static TENANTS array with async file-backed functions"
      - "tenants.ts: getTenantConfig() now async, reads from dev-tenants.json with 60s cache"
      - "tenants.ts: added createTenant(), updateTenant(), getAllTenants()"
      - "dev-tenants.json: seeded with rohlax + gldf tenant configs"
      - "api/admin/tenants/route.ts: GET (list all) + POST (create) endpoints, super-admin only"
      - "All callers updated to await async getTenantConfig/getCustomDomainMap/getTemplateForTenant"

  # ═══════════════════════════════════════════════════════════
  # PHASE 3: Subscription enforcement (Week 2)
  # ═══════════════════════════════════════════════════════════

  - id: billing-enforce
    title: "Subscription enforcement"
    status: done
    done_at: 2026-04-03
    changes:
      - "lib/subscription.ts: requireActiveSubscription() guard — cancelled=402, others=allow"
      - "lib/subscription.ts: getEffectiveSubscriptionStatus() — runtime override > static config"
      - "lib/storage.ts: getSubscriptionOverride/setSubscriptionOverride for webhook-driven status"
      - "api/agent/route.ts: subscription guard on POST (AI chat blocked if cancelled)"
      - "api/content/[section]/route.ts: subscription guard on PUT and DELETE"
      - "api/billing/webhook/route.ts: now writes status on invoice.paid/failed/subscription.deleted"
      - "components/dashboard/BillingBanner.tsx: dismissible banner for cancelled/past_due"
      - "dashboard/layout.tsx: renders BillingBanner with live subscription status"

  # ═══════════════════════════════════════════════════════════
  # PHASE 4: Self-serve onboarding flow (Week 2-3)
  # ═══════════════════════════════════════════════════════════

  - id: onboarding
    title: "Self-serve onboarding — describe your business → site is live"
    status: done
    done_at: 2026-04-03
    changes:
      - "api/onboard/generate/route.ts: POST endpoint — takes business info, generates content via Gemini structured output"
      - "api/onboard/complete/route.ts: POST endpoint — creates tenant, seeds content, creates Stripe checkout"
      - "app/onboard/page.tsx: multi-step flow (info → generating → preview → checkout) with subdomain picker"
      - "components/dashboard/WelcomeBanner.tsx: dismissible welcome banner on ?welcome=true"
      - "HubPage.tsx: added siteName prop + WelcomeBanner integration"
      - "Industry-to-template mapping auto-selects wellness/restaurant/trades/professional"

  # ═══════════════════════════════════════════════════════════
  # PHASE 5: Add 3 new templates (Week 3-4)
  # ═══════════════════════════════════════════════════════════

  - id: templates
    title: "Add restaurant, trades, professional templates"
    status: done
    done_at: 2026-04-03
    changes:
      - "templates/restaurant/index.ts: menu, events, reviews, reservation CTA. Warm earthy theme."
      - "templates/trades/index.ts: services+pricing, FAQ, free estimate CTA. Blue trust theme."
      - "templates/professional/index.ts: practice areas, firm story, testimonials, consultation CTA. Navy theme."
      - "All three reuse shared public components — no custom UI needed"
      - "registry.ts: all three registered with lazy require()"

  # ═══════════════════════════════════════════════════════════
  # PHASE 6: Proactive AI — weekly report + staleness (Week 4-5)
  # ═══════════════════════════════════════════════════════════

  - id: proactive-ai
    title: "Proactive AI — weekly report + staleness detection + actionable suggestions"
    status: done
    done_at: 2026-04-03
    changes:
      - "lib/reports.ts: weekly report engine — aggregates clicks, activity, staleness per tenant, LLM summary via Gemini"
      - "lib/suggestions.ts: suggestion system — stale/missing/engagement detection, per-tenant storage, deduplication"
      - "api/cron/weekly-report/route.ts: Vercel Cron (Monday 2pm UTC/9am ET), iterates tenants, sends HTML report via Resend"
      - "api/cron/staleness/route.ts: daily cron generates actionable suggestions per tenant"
      - "api/suggestions/route.ts: GET/POST for suggestion list + accept/dismiss"
      - "components/dashboard/SuggestionCards.tsx: one-tap 'Yes, do it' buttons that open chat with pre-filled prompt"
      - "HubPage.tsx: integrated SuggestionCards above static tips"
      - "vercel.json: cron schedules for weekly report + daily staleness"
      - "Cut web push notifications — email is Chelsea's channel, push adds complexity without value"

  # ═══════════════════════════════════════════════════════════
  # PHASE 7: Capability module system (Week 5-6)
  # ═══════════════════════════════════════════════════════════

  - id: capabilities
    title: "Capability module system — tools organized into named bundles"
    status: done
    done_at: 2026-04-03
    changes:
      - "lib/capabilities.ts: 6 capability bundles (website, analytics, email, blog, reviews, social) with tier mapping"
      - "lib/capabilities.ts: Starter=[website,analytics], Growth=+[email,blog,reviews], Scale=+[social]"
      - "lib/capabilities.ts: blog/reviews/social marked as v2 stubs (not yet implemented)"
      - "types.ts: added SubscriptionTier type + tier field on TenantConfig"
      - "api/agent/route.ts: tools dynamically filtered by tenant tier — locked tools not exposed to LLM"
      - "api/agent/route.ts: system prompt includes capability fragment describing active/locked features"
      - "api/agent/route.ts: added get_metrics + get_activity tools (analytics capability)"
      - "api/capabilities/route.ts: GET endpoint returns tier, capabilities, pricing for dashboard"
      - "components/dashboard/CapabilityGate.tsx: provider + gate component — locked features show upgrade prompt"
      - "dashboard/layout.tsx: wrapped with CapabilityProvider"

  # ═══════════════════════════════════════════════════════════
  # PHASE 8: Deploy + Chelsea live test (Week 6)
  # ═══════════════════════════════════════════════════════════

  - id: deploy
    title: "Production readiness + deploy prep"
    status: done
    done_at: 2026-04-03
    changes:
      - "lib/tenants.ts: added Sanity backend for tenant storage (was dev JSON only)"
      - "lib/suggestions.ts: added Sanity backend for suggestion storage"
      - "lib/subscription.ts: simplified to read directly from tenant config (no separate override)"
      - "api/billing/webhook/route.ts: now calls updateTenant() instead of setSubscriptionOverride()"
      - "sanity/schemas/tenant.ts: Sanity schema for tenant documents"
      - "sanity/schemas/suggestion.ts: Sanity schema for suggestion documents"
      - "sanity/schemas/index.ts: registered tenant + suggestion schemas"
      - "middleware.ts: protected /api/suggestions + /api/capabilities routes, added cron route bypass"
      - ".env.example: complete with all 16 env vars grouped by service"
      - "Fixed hardcoded rohlaxwellness.com fallback → reb.studio in newsletter route"
    remaining_manual:
      - "Buy reb.studio domain (or confirm ownership)"
      - "Add wildcard DNS (*.reb.studio → Vercel)"
      - "Set all env vars in Vercel dashboard"
      - "Deploy to Vercel"
      - "Migrate Chelsea's content to Sanity production"
      - "Run Chelsea live test (15 min watching her use chat)"

  # ═══════════════════════════════════════════════════════════
  # PHASE 9: Marketing site + second client (Week 7-8)
  # ═══════════════════════════════════════════════════════════

  - id: marketing
    title: "Marketing site reposition + second client"
    status: done
    done_at: 2026-04-03
    changes:
      - "agency/page.tsx: full rewrite — platform positioning, self-serve CTA (/onboard), tiered pricing ($49/149/399)"
      - "Hero: 'Your business online in 5 minutes' + 'No credit card required'"
      - "How it works: describe → chat → weekly reports"
      - "Who it's for: local businesses (yoga, plumbers, restaurants, accountants)"
      - "Pricing: 3 tiers (Starter/Growth/Scale) with feature breakdown"
      - "SEO metadata: 'AI website management for local businesses' + keyword targeting"
      - "All CTAs link to /onboard self-serve flow"
    remaining_manual:
      - "Chelsea case study with real metrics (need live data first)"
      - "Onboard second client from Chelsea's network"
      - "Product Hunt prep"
