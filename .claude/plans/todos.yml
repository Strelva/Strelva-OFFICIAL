# REB Platform — Build Plan
# AI website management platform with modular capabilities
# Pivoted from agency model 2026-04-03
#
# Timeline: 8 weeks to graduation (May 2026)
# Status key: done, in-progress, todo

phases:

  # ═══════════════════════════════════════════════════════════
  # PHASE 1: Generalize from wellness-specific (Week 1)
  # ═══════════════════════════════════════════════════════════

  - id: generalize
    title: "Generalize from wellness-specific to universal"
    status: done
    done_at: 2026-04-03
    changes:
      - "schemas.ts: replaced hardcoded provider/shop/event category enums with z.string()"
      - "types.ts: ProviderItem.category, ShopItem.category, EventItem.hosted_by → string"
      - "types.ts: TemplateId extended with restaurant, trades, professional + string escape hatch"
      - "types.ts: TenantConfig gained ownerEmail, bookingProvider, bookingUrl, resendDomain fields"
      - "agent/route.ts: booking prompt uses tenantConfig.bookingProvider instead of hardcoded Vagaro"
      - "agent/route.ts: newsletter from-domain uses tenantConfig.resendDomain, fallback updates.reb.studio"
      - "registry.ts: template registry uses Record<string, TemplateDefinition>, added registerTemplate()"

  # ═══════════════════════════════════════════════════════════
  # PHASE 2: Database-backed tenant registry (Week 1-2)
  # ═══════════════════════════════════════════════════════════

  - id: db-tenants
    title: "Database-backed tenant registry"
    status: done
    done_at: 2026-04-03
    changes:
      - "tenants.ts: replaced static TENANTS array with async file-backed functions"
      - "tenants.ts: getTenantConfig() now async, reads from dev-tenants.json with 60s cache"
      - "tenants.ts: added createTenant(), updateTenant(), getAllTenants()"
      - "dev-tenants.json: seeded with rohlax + gldf tenant configs"
      - "api/admin/tenants/route.ts: GET (list all) + POST (create) endpoints, super-admin only"
      - "All callers updated to await async getTenantConfig/getCustomDomainMap/getTemplateForTenant"

  # ═══════════════════════════════════════════════════════════
  # PHASE 3: Subscription enforcement (Week 2)
  # ═══════════════════════════════════════════════════════════

  - id: billing-enforce
    title: "Subscription enforcement"
    status: done
    done_at: 2026-04-03
    changes:
      - "lib/subscription.ts: requireActiveSubscription() guard — cancelled=402, others=allow"
      - "lib/subscription.ts: getEffectiveSubscriptionStatus() — runtime override > static config"
      - "lib/storage.ts: getSubscriptionOverride/setSubscriptionOverride for webhook-driven status"
      - "api/agent/route.ts: subscription guard on POST (AI chat blocked if cancelled)"
      - "api/content/[section]/route.ts: subscription guard on PUT and DELETE"
      - "api/billing/webhook/route.ts: now writes status on invoice.paid/failed/subscription.deleted"
      - "components/dashboard/BillingBanner.tsx: dismissible banner for cancelled/past_due"
      - "dashboard/layout.tsx: renders BillingBanner with live subscription status"

  # ═══════════════════════════════════════════════════════════
  # PHASE 4: Self-serve onboarding flow (Week 2-3)
  # ═══════════════════════════════════════════════════════════

  - id: onboarding
    title: "Self-serve onboarding — describe your business → site is live"
    status: done
    done_at: 2026-04-03
    changes:
      - "api/onboard/generate/route.ts: POST endpoint — takes business info, generates content via Gemini structured output"
      - "api/onboard/complete/route.ts: POST endpoint — creates tenant, seeds content, creates Stripe checkout"
      - "app/onboard/page.tsx: multi-step flow (info → generating → preview → checkout) with subdomain picker"
      - "components/dashboard/WelcomeBanner.tsx: dismissible welcome banner on ?welcome=true"
      - "HubPage.tsx: added siteName prop + WelcomeBanner integration"
      - "Industry-to-template mapping auto-selects wellness/restaurant/trades/professional"

  # ═══════════════════════════════════════════════════════════
  # PHASE 5: Add 3 new templates (Week 3-4)
  # ═══════════════════════════════════════════════════════════

  - id: templates
    title: "Add restaurant, trades, professional templates"
    status: todo
    details: |
      For each: create src/components/templates/{name}/index.ts with TemplateDefinition.
      Reuse shared public components (Hero, Contact, Testimonials, FAQ) where possible.
      - restaurant: menu sections, hours, location, reservation link, events/specials
      - trades: services+pricing, service area, before/after gallery, license badges, free estimate CTA
      - professional: team bios, practice areas, case results, blog, consultation CTA
      Register each in registry.ts. Add default content in defaults.ts + pageConfigDefaults.ts.

  # ═══════════════════════════════════════════════════════════
  # PHASE 6: Proactive AI — weekly report + staleness (Week 4-5)
  # ═══════════════════════════════════════════════════════════

  - id: proactive-ai
    title: "Proactive AI — weekly report + staleness detection + push notifications"
    status: todo
    details: |
      1. Weekly report email (Vercel Cron, Monday 9am):
         - Per tenant: pull analytics, activity log, generate plain-English summary via LLM
         - Send via Resend: "Here's what happened on your site this week"
      2. Staleness detection (daily cron):
         - Flag sections >30 days stale, store as pending suggestion
      3. Web Push notifications:
         - Service worker + VAPID keys
         - Push on: weekly report, staleness alert, AI suggestion
      4. Suggestion system in dashboard HubPage — one-tap "Yes, do it"

  # ═══════════════════════════════════════════════════════════
  # PHASE 7: Capability module system (Week 5-6)
  # ═══════════════════════════════════════════════════════════

  - id: capabilities
    title: "Capability module system — tools organized into named bundles"
    status: todo
    details: |
      1. lib/capabilities.ts — define bundles:
         website: [read_section, update_section, upload_image]
         analytics: [get_metrics, get_activity]
         email: [send_newsletter, list_subscribers]
         social/reviews/blog: v2 stubs
      2. Tier → capability mapping (Starter/Growth/Scale)
      3. Agent tool filtering based on tenant's tier
      4. System prompt only describes activated capabilities
      5. Dashboard upgrade prompts for locked features

  # ═══════════════════════════════════════════════════════════
  # PHASE 8: Deploy + Chelsea live test (Week 6)
  # ═══════════════════════════════════════════════════════════

  - id: deploy
    title: "Deploy to production + Chelsea live test"
    status: todo
    details: |
      1. Buy domain, add to Vercel, wildcard DNS
      2. Deploy: root → marketing, subdomains → client sites
      3. Migrate Chelsea to production storage
      4. 15-min user test watching Chelsea use chat
      5. Production env vars: Stripe, Clerk, Resend, Slack webhook

  # ═══════════════════════════════════════════════════════════
  # PHASE 9: Marketing site + second client (Week 7-8)
  # ═══════════════════════════════════════════════════════════

  - id: marketing
    title: "Marketing site reposition + second client"
    status: todo
    details: |
      1. Update landing page: agency → platform positioning
      2. Chelsea case study with real metrics
      3. Onboard second client from Chelsea's network
      4. SEO: target "AI website management", "HoneyBook alternative"
      5. Product Hunt prep
