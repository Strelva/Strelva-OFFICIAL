<!doctype html>
<html lang="en" data-theme="dark" data-paused="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strelva typography comparison</title><link rel="preload" href="inter-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url('inter-latin.woff2');font-weight:100 900;font-display:swap}@font-face{font-family:Fraunces;src:url('fraunces-latin.woff2');font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#101518;--text:#eeeae0;--muted:#acb9bf;--glass:#152332c9;--inner:#14202bdc;--rule:#ffffff25;--accent:#a9c09c;font:14px/20px Inter,sans-serif}html[data-theme=light]{color-scheme:light;--bg:#f2f3ef;--text:#172b34;--muted:#536469;--glass:#f4f6e6c4;--inner:#fcfdf5e0;--rule:#193a3c25;--accent:#557650}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1600px;margin:auto;padding:40px 48px}h1,h2,h3,p{margin:0}h1{font-size:32px;line-height:40px;letter-spacing:-.8px;font-weight:500}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:32px}header p{margin-top:8px;color:var(--muted)}button{font:inherit;border:1px solid var(--rule);color:var(--text);background:var(--bg);padding:8px 16px;min-height:40px;border-radius:12px;cursor:pointer;touch-action:manipulation}button:hover{filter:brightness(1.2)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button[aria-pressed=true]{background:var(--text);color:var(--bg)}.controls{display:flex;gap:8px}.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{min-width:0}.label{font-size:12px;color:var(--muted);margin-bottom:16px}.stage{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;padding:24px;background:#152235;min-height:592px;display:flex;flex-direction:column}.canvas-material{position:absolute;inset:0;width:100%;height:100%;z-index:-2}.stage:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#101823da,transparent 80%)}.wordmark{display:flex;gap:8px;align-items:center;color:#eeeae0;font:500 24px/32px Fraunces,serif;font-variation-settings:'SOFT' 0,'WONK' 0;letter-spacing:-.24px}.wordmark svg{width:32px;height:32px}.headline{font:500 40px/44px Inter,sans-serif;letter-spacing:-1.2px;color:#eeeae0;margin-top:40px;text-wrap:balance;min-height:144px}.b .headline,.c .headline{font:400 44px/48px Fraunces,serif;font-variation-settings:'SOFT' 0,'WONK' 0;letter-spacing:-.8px}.glass{margin-top:auto;padding:24px;border-radius:24px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--rule)}.glass h3{font:500 20px/28px Inter,sans-serif;letter-spacing:-.3px}.c .glass h3{font:400 24px/28px Fraunces,serif;font-variation-settings:'SOFT' 0,'WONK' 0}.glass>p{font-size:14px;line-height:20px;color:var(--muted);margin:8px 0 24px;min-height:40px}.row{padding:16px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;font-size:12px;line-height:16px}.row span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}.row span{overflow-wrap:anywhere;min-width:0}.glass button{margin-top:8px;min-height:40px;width:100%;background:var(--text);color:var(--bg);font-weight:500}.notes{padding:24px 0}.notes h2{font-size:16px;font-weight:500;margin-bottom:8px}.notes p{color:var(--muted);line-height:24px}.roles{border-top:1px solid var(--rule);padding-top:16px;margin-top:16px;font-size:12px;line-height:24px;color:var(--muted)}footer{border-top:1px solid var(--rule);padding:24px 0;margin-top:16px;color:var(--muted)}.skip{position:absolute;top:-80px;color:var(--text);background:var(--bg);padding:16px}.skip:focus{top:0}.decision{color:var(--accent);font-size:12px;margin-top:8px;min-height:20px}a{color:inherit}a:hover{text-decoration:none}@media(max-width:1000px){main{padding:32px}.comparison{grid-template-columns:1fr}.stage{min-height:560px}.headline{max-width:440px}header{align-items:flex-start;flex-direction:column}.glass{max-width:560px}.notes{max-width:65ch}}@media(max-width:640px){main{padding:24px}.headline{font-size:36px;line-height:40px}.b .headline,.c .headline{font-size:40px;line-height:44px}.stage{min-height:640px}.glass{padding:24px}.glass>p{min-height:0}.wordmark{font-size:24px}.controls{flex-wrap:wrap}h1{font-size:28px;line-height:36px}}
</style></head><body><a class="skip" href="#main">Skip to comparison</a><main id="main"><header><div><h1>How much serif should Strelva carry?</h1><p>Same material, mark, copy and spacing. Only the type roles change.</p></div><div class="controls" role="group" aria-label="Theme"><button data-theme="dark" aria-pressed="true">Dark</button><button data-theme="light" aria-pressed="false">Light</button></div></header><section class="comparison" aria-label="Typography treatments"></section><footer>Actual Inter and Fraunces font files from the project. Static material for a fair comparison. Selections stay in this tab; they do not update the brand rules.</footer></main><script>
const specimens=[['a','01 / Product-led','Serif identity, sans-serif product','My starting recommendation. The mark and wordmark carry warmth; the interface stays technical.','Wordmark: Fraunces 500 · Headline: Inter 500 · UI: Inter 400/500'],['b','02 / Launch-led','Serif at the big moment','More distinctive and editorial. Use for selected launch statements, with product headings and controls kept in Inter.','Wordmark: Fraunces 500 · Headline: Fraunces 400 · UI: Inter 400/500'],['c','03 / Editorial-led','Serif throughout the hierarchy','The softest treatment. It may feel more like a cultural or hospitality brand than the technology product you described.','Wordmark/headline/title: Fraunces · Body and controls: Inter']];
const mark='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24.5" cy="7.2" r="3.4" fill="#a9c09c"/><ellipse cx="20.5" cy="15.9" rx="6.6" ry="4" fill="currentColor" transform="rotate(-8 20.5 15.9)"/><ellipse cx="22.5" cy="26.4" rx="9.4" ry="4.9" fill="currentColor" transform="rotate(5 22.5 26.4)"/><ellipse cx="24" cy="38.5" rx="12.2" ry="5.6" fill="currentColor" transform="rotate(-3 24 38.5)"/></svg>';
document.querySelector('.comparison').innerHTML=specimens.map(([id,label,title,description,roles])=>`<article class="${id}"><p class="label">${label}</p><div class="stage"><canvas class="canvas-material" data-variant="0" aria-hidden="true"></canvas><div class="wordmark" translate="no">${mark}Strelva</div><h2 class="headline">Make room for what comes next.</h2><div class="glass"><h3>Project context</h3><p>The people, decisions and commitments behind your next step.</p><div class="row"><span>People</span><span>3 collaborators</span></div><div class="row"><span>Latest decision</span><span>Direction approved</span></div><button data-select="${id}">Compare this direction</button></div></div><div class="notes"><h2>${title}</h2><p>${description}</p><div class="roles">${roles}</div><p class="decision" id="choice-${id}" aria-live="polite"></p></div></article>`).join('');
document.querySelectorAll('[data-theme]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.addEventListener('click',()=>{document.documentElement.dataset.theme=b.dataset.theme;document.querySelectorAll('button[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})});document.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.decision').forEach(x=>x.textContent='');document.querySelector('#choice-'+b.dataset.select).textContent='Selected for discussion, not saved as a brand decision.'}));
</script><script src="cloud-material.js"></script></body></html>
