# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Production Self-Serve Platform"
  slug: "production-self-serve-platform"
  kind: existing_plan
  tranche: "Validate the current repo and named branches, then complete successive safe verified slices for self-serve activation, retention analytics/briefs, and rollback safety."
  status: done
  intake:
    original_request: "Production-grade self-serve onboarding, retention analytics/weekly briefs, and backup/versioning/rollback safety."
    interpreted_outcome: "Scaffold Web becomes a self-serve local-business platform where owners can sign up, get live quickly, see proof of value, receive retention prompts, and trust AI changes because rollback/audit safety exists."
    input_shape: existing_plan
    audience: "Jacob and local business owners"
    authority: requested
    proof_type: test
    completion_proof: "Tests and current repo evidence prove self-serve signup/onboarding, first-run quick wins, owner metrics/weekly brief retention surfaces, churn re-engagement hooks, and rollback/audit safety are implemented or only externally blocked."
    likely_misfire: "Shipping dashboard polish or generic planning while the under-10-minute self-serve activation path remains founder-heavy."
    blind_spots_considered:
      - "Named branches may contain useful work that should be inspected rather than recreated."
      - "Production credentials and third-party providers may block live external verification."
      - "Owner metrics must be sourced from real activity/event data, not decorative counts."
      - "AI autonomy should not increase without visible audit and rollback confidence."
    existing_plan_facts:
      - "Complete self-serve B2C signup -> instant subdomain site + AI agent boot."
      - "Inspect and potentially ship existing branches `codex/self-serve-b2c-product` and `codex/free-site-signup-copy`."
      - "Guided first-time owner journey: tell us about your business -> AI pre-fills content -> one-click publish."
      - "Welcome quick wins: hours update, Google Business sync, first blog post."
      - "Owner dashboard metrics: AI changes this week, traffic from AI content, engagement signals."
      - "Weekly email brief should be beautiful and actionable."
      - "Churn predictors: low logins or no AI usage in 14 days -> auto-re-engage sequence."
      - "Simple product analytics via PostHog or Vercel Analytics plus custom events."
      - "One-click revert, daily backups, and owner-visible audit log with diff are non-negotiable safety net."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/production-self-serve-platform/"
    command: "npx goalbuddy board docs/goals/production-self-serve-platform"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current repo state and named branches against the three requested product tracks."
    inputs:
      - "AGENTS.md instructions in conversation"
      - "package.json"
      - "docs/*.md"
      - "src/app routes and API handlers"
      - "src/lib tenant, storage, analytics, reports, weekly brief, events, auth, agent files"
      - "tests and existing dirty diff"
      - "Branches `codex/self-serve-b2c-product` and `codex/free-site-signup-copy` if present"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Preserve the user-provided plan facts."
      - "Separate repo facts from product taste judgments and hypotheses."
    expected_output:
      - "Current self-serve/onboarding coverage and gaps"
      - "Current analytics/weekly brief/retention coverage and gaps"
      - "Current backup/versioning/rollback/audit coverage and gaps"
      - "Useful work present on named branches"
      - "Verification commands and risk flags"
      - "Ranked candidate Worker slices"
    receipt:
      result: done
      note: "notes/T001-scout-map.md"
      summary: "Current main is still email-first/founder-heavy for signup, while `origin/codex/self-serve-b2c-product` contains a coherent self-serve tenant provisioning API, starter content builder, checkout helper, and tests. Weekly proof/report and per-section rollback primitives already exist; churn re-engagement and full-site backup/restore are not proven."
      evidence:
        - "src/app/onboard/page.tsx"
        - "src/app/access-request/page.tsx"
        - "src/app/api/access-request/intake/route.ts"
        - "src/app/sign-up/[[...sign-up]]/page.tsx"
        - "origin/codex/self-serve-b2c-product:src/lib/self-serve.ts"
        - "origin/codex/self-serve-b2c-product:src/app/api/self-serve/tenant/route.ts"
        - "src/app/dashboard/page.tsx"
        - "src/app/dashboard/reports/page.tsx"
        - "src/lib/weekly-brief.ts"
        - "src/lib/storage/version-store.ts"
        - "src/app/api/content/[section]/versions/route.ts"
      spawned_tasks:
        - T002
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the first largest safe useful implementation slice from Scout findings."
    inputs:
      - "T001 receipt"
      - "Current dirty diff"
    constraints:
      - "Do not implement."
      - "Prioritize under-10-minute self-serve activation unless repo evidence proves a safety or trust blocker must come first."
      - "Prefer integrating useful existing branch work over recreating it."
      - "Worker task must include allowed_files, verify commands, and stop conditions."
    expected_output:
      - "Decision"
      - "Rejected alternatives"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Whether ChatGPT strategy critique is needed before implementation"
    receipt:
      result: done
      decision: "Integrate the backend self-serve tenant provisioning/API/test slice from `origin/codex/self-serve-b2c-product` first, while preserving the current email-first `/access-request` and invite-guarded `/sign-up` UX."
      rationale: "This is the largest safe useful move toward the user's highest-leverage outcome: instant tenant/subdomain/starter-site creation. It creates the missing platform primitive without prematurely replacing current signup copy or dashboard surfaces."
      rejected_alternatives:
        - "Merge the full self-serve branch UI wholesale: higher regression risk because current main intentionally changed `/onboard`, `/sign-up`, access requests, billing audit, and owner copy after that branch."
        - "Start with retention analytics: useful, but retention depends on owners first reaching a real self-serve activation moment."
        - "Start with full-site rollback: important safety work, but current per-section version restore already provides some safety while self-serve has no current backend primitive."
      chatgpt_strategy_critique: "Not required before this backend primitive because repo evidence and the user-provided sequence are aligned. No callable ChatGPT web surface was available in this session; use the strategy loop later for onboarding copy/demo narrative once the primitive exists."
      next_allowed_task: T003
      allowed_files:
        - "src/lib/self-serve.ts"
        - "src/lib/billing.ts"
        - "src/app/api/self-serve/tenant/route.ts"
        - "src/app/api/self-serve/checkout/route.ts"
        - "src/__tests__/self-serve.test.ts"
        - "src/__tests__/self-serve-routes.test.ts"
      verify:
        - "pnpm test src/__tests__/self-serve.test.ts src/__tests__/self-serve-routes.test.ts"
        - "pnpm typecheck"
        - "git diff --check"
      stop_if:
        - "Need to replace current `/access-request`, `/onboard`, or `/sign-up` UX."
        - "Need production credentials or destructive tenant writes to verify."
        - "Self-serve APIs require changes outside allowed files."
        - "Verification fails twice."
