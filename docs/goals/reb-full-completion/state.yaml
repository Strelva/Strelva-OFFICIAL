# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Scaffold Web Full Completion"
  slug: "reb-full-completion"
  kind: open_ended
  tranche: "Diagnose the product from the repo, finish the core customer-facing product experience through wedge-moving verified slices, and audit the full product-completion outcome."
  status: done
  intake:
    original_request: "lets run goals for us to focus on getting fto full cpmpletion and consider advance-product-version"
    interpreted_outcome: "Run a GoalBuddy board that drives the reb product toward full product completion using a codebase-first product operator lens."
    input_shape: vague
    audience: "Jacob / Scaffold Web customers"
    authority: requested
    proof_type: artifact
    completion_proof: "Final audit proves the customer-facing and operator-facing product flows are complete enough for real product use, with implemented slices verified by tests/build/browser or documented blockers."
    likely_misfire: "Producing a generic roadmap or scattered cleanup tasks instead of verified, product-relevant completion work."
    blind_spots_considered:
      - "Completion target is product completion."
      - "Success proof defaults to end-to-end product use across customer and operator flows."
      - "Scope defaults to product completion, not pure launch ops or growth features."
      - "Existing completion docs may contain useful facts but have not been inspected during goal-prep."
    existing_plan_facts:
      - "Use the `advance-product-version` skill during the eventual `/goal` run."
      - "Use a local live GoalBuddy board."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://127.0.0.1:41737/"
    command: "npx goalbuddy board docs/goals/reb-full-completion"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T000
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Complete diagnostic intake and finalize the GoalBuddy board before `/goal` execution."
    constraints:
      - "Only edit GoalBuddy control files during goal-prep."
      - "Do not inspect implementation files or run product diagnosis."
      - "Do not execute `advance-product-version` until `/goal`."
    expected_output:
      - "Finalized completion target"
      - "Finalized proof"
      - "Finalized scope and non-goals"
      - "Seeded task board"
    receipt:
      result: done
      summary: "User started `/goal` and clarified the target as product completion for all of reb. Defaults: product-complete means core customer and operator flows are complete enough for real product use; launch ops, pure technical cleanup, and growth features are secondary unless they block the product."
      evidence:
        - "docs/goals/reb-full-completion/goal.md"
        - "docs/goals/reb-full-completion/state.yaml"
      spawned_tasks:
        - T001
        - T002
        - T003
        - T004
        - T999
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the actual reb product surface, completion docs, routes, workflows, data models, AI surfaces, admin/operator surfaces, and verification commands."
    inputs:
      - "AGENTS.md user instructions"
      - "package.json"
      - "docs/*.md"
      - "src routes, APIs, components, lib, and tests"
    constraints:
      - "Read-only."
      - "Use `advance-product-version` as the product diagnosis lens."
      - "Separate repo facts from taste judgments and hypotheses."
    expected_output:
      - "Current product stage and bottleneck"
      - "Existing product surfaces"
      - "Completion blockers and gaps"
      - "Verification commands"
      - "Candidate wedge-moving Worker slices"
    receipt:
      result: done
      note: "notes/T001-product-scout.md"
      summary: "Mapped the repo as a V1.5 product with launch readiness mostly handled and product completion bottlenecked by activation proof. Found weekly report generation/rendering exists but `/dashboard/reports` redirects away and nav does not expose reports."
      evidence:
        - "package.json"
        - "docs/completion-audit.md"
        - "docs/launch-blockers.md"
        - "src/app/dashboard/reports/page.tsx"
        - "src/components/dashboard/WeeklyBriefClient.tsx"
        - "src/lib/weekly-brief.ts"
        - "src/components/dashboard/HistorySidebar.tsx"
        - "src/components/dashboard/MobileNav.tsx"
      spawned_tasks:
        - T002
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the first highest-leverage safe implementation slice for product completion based on Scout findings."
    inputs:
      - "T001 receipt or note"
      - "Current dirty diff"
    constraints:
      - "Do not implement."
      - "Prefer one coherent product-completion move over scattered cleanup."
      - "Worker task must include allowed_files, verify commands, and stop_if conditions."
    expected_output:
      - "Decision"
      - "Rejected alternatives"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: "Do the weekly report exposure slice first: render `/dashboard/reports` with the existing WeeklyBriefClient and add Reports to dashboard navigation."
      rejected_alternatives:
        - "Overview panel in chat: useful, but adds a new composite surface before fixing the existing hidden proof surface."
        - "AI receipt tightening: valuable trust work, but less directly tied to the 'see what is working' product promise."
        - "More launch-readiness work: docs indicate launch gate is already mostly complete and this goal is product completion."
      next_allowed_task: T003
      allowed_files:
        - "src/app/dashboard/reports/page.tsx"
        - "src/components/dashboard/HistorySidebar.tsx"
        - "src/components/dashboard/MobileNav.tsx"
        - "src/__tests__/owner-journey-copy.test.ts"
      verify:
        - "pnpm test src/__tests__/owner-journey-copy.test.ts"
        - "pnpm typecheck"
      stop_if:
        - "Reports require new data primitives instead of existing weekly-brief helpers."
        - "Need to change auth, tenant access, or storage contracts."
        - "Verification fails twice."
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Execute the first safe product-completion implementation slice selected by Judge."
    allowed_files:
      - "src/app/dashboard/reports/page.tsx"
      - "src/components/dashboard/HistorySidebar.tsx"
      - "src/components/dashboard/MobileNav.tsx"
      - "src/__tests__/owner-journey-copy.test.ts"
    verify:
      - "pnpm test src/__tests__/owner-journey-copy.test.ts"
      - "pnpm typecheck"
    stop_if:
      - "Need files outside allowed_files."
      - "Product behavior is ambiguous."
      - "Verification fails twice."
      - "The slice requires credentials, production access, or destructive changes."
    receipt:
      result: done
      changed_files:
        - "src/app/dashboard/reports/page.tsx"
        - "src/components/dashboard/HistorySidebar.tsx"
        - "src/components/dashboard/MobileNav.tsx"
        - "src/__tests__/owner-journey-copy.test.ts"
      commands:
        - cmd: "pnpm test src/__tests__/owner-journey-copy.test.ts -t \"keeps weekly reports reachable as the proof surface\""
          status: pass
        - cmd: "pnpm typecheck"
          status: pass
      summary: "Exposed `/dashboard/reports` as the weekly proof surface, rendered existing WeeklyBriefClient data, and added Reports to desktop/mobile dashboard navigation. The full owner-journey test initially exposed a separate actionable-AI-feedback assertion, which was split into T005."
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit the completed implementation slice and decide whether to advance to another product-completion slice."
    inputs:
      - "T003 receipt"
      - "Verification output"
      - "Current dirty diff"
    constraints:
      - "Do not implement."
      - "Treat slice completion as a checkpoint, not full completion, unless evidence proves the whole product-completion outcome."
    expected_output:
      - "slice_complete: true | false"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: "Reports slice is implemented and locally type-safe, but full owner-journey verification revealed the next product-completion gap: AI result feedback copy no longer proves a live-site change in the place the test expects."
      slice_complete: true
      full_outcome_complete: false
      missing_evidence:
        - "Full owner-journey copy test is red until AI action receipt proof copy is restored or the test is aligned to the receipt source."
      next_allowed_task: T005
      spawned_tasks:
        - T005
  - id: T005
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Restore actionable AI result proof copy and align owner-journey coverage with the receipt source."
    allowed_files:
      - "src/lib/agent-results.ts"
      - "src/__tests__/agent-results.test.ts"
      - "src/__tests__/owner-journey-copy.test.ts"
    verify:
      - "pnpm test src/__tests__/agent-results.test.ts src/__tests__/owner-journey-copy.test.ts"
      - "pnpm typecheck"
    stop_if:
      - "Need to change ChatPanel behavior or streaming contracts."
      - "Receipt semantics are ambiguous."
      - "Verification fails twice."
    receipt:
      result: done
      changed_files:
        - "src/lib/agent-results.ts"
        - "src/__tests__/agent-results.test.ts"
        - "src/__tests__/owner-journey-copy.test.ts"
      commands:
        - cmd: "pnpm test src/__tests__/agent-results.test.ts src/__tests__/owner-journey-copy.test.ts"
          status: pass
        - cmd: "pnpm typecheck"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Restored live-site proof language in AI result receipts and aligned owner-journey coverage with the receipt source that ChatPanel renders."
  - id: T006
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Continue the product-completion audit across the customer dashboard and operator surfaces to identify the next highest-leverage slice."
    inputs:
      - "Changed reports and receipt slices"
      - "Dashboard routes and browser observations"
      - "Admin/operator surfaces"
      - "Existing tests and docs"
    constraints:
      - "Read-only."
      - "Do not repeat T001 findings except where needed for the next decision."
      - "Prioritize product completion over launch ops, pure cleanup, or growth features."
    expected_output:
      - "Next product-completion gap"
      - "Evidence"
      - "Recommended Worker slice"
      - "Verification plan"
    receipt:
      result: done
      note: "notes/T006-next-gap-scout.md"
      summary: "Found the next product-completion gap: weekly report emails still point to `/dashboard`, which redirects to chat, rather than the newly reachable `/dashboard/reports` proof surface."
      evidence:
        - "src/app/api/cron/weekly-report/route.ts"
        - "src/app/dashboard/page.tsx"
        - "src/app/dashboard/reports/page.tsx"
        - "src/components/dashboard/WeeklyBriefClient.tsx"
        - "src/__tests__/owner-journey-copy.test.ts"
      spawned_tasks:
        - T007
  - id: T007
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Make weekly report emails land on the weekly report dashboard surface and update owner-journey coverage."
    allowed_files:
      - "src/app/api/cron/weekly-report/route.ts"
      - "src/__tests__/owner-journey-copy.test.ts"
    verify:
      - "pnpm test src/__tests__/owner-journey-copy.test.ts"
      - "pnpm typecheck"
    stop_if:
      - "Need to redesign weekly report generation."
      - "Need files outside allowed_files."
      - "Verification fails twice."
    receipt:
      result: done
      changed_files:
        - "src/app/api/cron/weekly-report/route.ts"
        - "src/__tests__/owner-journey-copy.test.ts"
      commands:
        - cmd: "pnpm test src/__tests__/owner-journey-copy.test.ts"
          status: pass
        - cmd: "pnpm typecheck"
          status: pass
      summary: "Weekly report email CTA now says `View your weekly report` and links owners directly to `/dashboard/reports` instead of the generic dashboard/chat entry."
  - id: T008
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit current product-completion progress and decide whether another safe implementation slice is required before final audit."
    inputs:
      - "T001-T007 receipts"
      - "Current diff"
      - "Goal objective"
    constraints:
      - "Do not implement."
      - "Do not mark full outcome complete unless customer and operator product completion are both evidenced."
      - "If a safe high-leverage slice remains, create or select it instead of stopping."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "remaining product gaps"
      - "next Worker task if not complete"
    receipt:
      result: done
      decision: "Continue with one more retention-loop slice: the weekly report HTML email points to `/dashboard/reports`, but the plain-text email body still omits the report URL."
      complete: not_complete
      full_outcome_complete: false
      remaining_product_gaps:
        - "Text-only weekly report emails do not include the direct weekly report link."
        - "Broader customer/operator completion still requires final audit after verified slices."
      next_allowed_task: T009
      allowed_files:
        - "src/app/api/cron/weekly-report/route.ts"
        - "src/__tests__/owner-journey-copy.test.ts"
      verify:
        - "pnpm test src/__tests__/owner-journey-copy.test.ts"
        - "pnpm typecheck"
  - id: T009
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Include the direct weekly report URL in plain-text weekly report emails and guard the behavior."
    allowed_files:
      - "src/app/api/cron/weekly-report/route.ts"
      - "src/__tests__/owner-journey-copy.test.ts"
    verify:
      - "pnpm test src/__tests__/owner-journey-copy.test.ts"
      - "pnpm typecheck"
    stop_if:
      - "Need to change email provider integration."
      - "Need files outside allowed_files."
      - "Verification fails twice."
    receipt:
      result: done
      changed_files:
        - "src/app/api/cron/weekly-report/route.ts"
        - "src/__tests__/owner-journey-copy.test.ts"
      commands:
        - cmd: "pnpm test src/__tests__/owner-journey-copy.test.ts"
          status: pass
        - cmd: "pnpm typecheck"
          status: pass
      summary: "Plain-text weekly report emails now include the direct `/dashboard/reports` URL, matching the HTML CTA and completing the email-to-report retention path."
  - id: T010
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Run a completion audit against the active goal and identify what remains before reb can be called fully product-complete."
    inputs:
      - "Goal objective"
      - "All receipts"
      - "Current diff"
      - "Verification commands"
      - "Browser observation for reports route"
    constraints:
      - "Do not implement."
      - "Do not mark the goal done unless all customer and operator product-completion criteria are evidenced."
      - "Create the next task if the goal is not complete."
    expected_output:
      - "Prompt-to-artifact checklist"
      - "Evidence"
      - "Missing or weakly verified requirements"
      - "Next task"
    receipt:
      result: done
      note: "notes/T010-completion-audit.md"
      decision: "not_complete"
      full_outcome_complete: false
      summary: "Reports/proof-loop slices are complete and verified, but full product completion is not yet evidenced across the complete customer and operator experience."
      missing_evidence:
        - "End-to-end customer dashboard journey across chat, reports, approvals, site editor, connections, settings, and assets."
        - "Operator/admin journey after current diffs."
        - "Full release/build gate after current dirty worktree."
      next_allowed_task: T011
  - id: T011
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map and verify the current customer dashboard journey end-to-end, then identify the next highest-leverage product-completion slice."
    inputs:
      - "Dashboard routes"
      - "Existing smoke tests"
      - "Local browser behavior"
      - "Current diffs"
    constraints:
      - "Read-only."
      - "Prefer browser/test evidence over assumptions."
      - "Do not touch unrelated dirty files."
    expected_output:
      - "Customer journey checklist"
      - "Observed evidence"
      - "Next product-completion gap"
      - "Recommended Worker slice with allowed files and verification"
    receipt:
      result: done
      note: "notes/T011-dashboard-journey-scout.md"
      summary: "Existing smoke coverage focuses on public and signed-out flows; browser sweep showed customer dashboard routes render under dev access, but no automated signed-in-style owner dashboard journey test exists."
      evidence:
        - "tests/customer-frontend.spec.ts"
        - "tests/smoke.spec.ts"
        - "tests/control-plane-smoke.spec.ts"
        - "Browser sweep of /dashboard/chat, /dashboard/reports, /dashboard/review, /dashboard/site, /dashboard/sources, /dashboard/settings, /dashboard/assets"
      spawned_tasks:
        - T012
  - id: T012
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Add an automated owner-dashboard smoke test for the signed-in-style customer dashboard journey under dev access."
    allowed_files:
      - "tests/dashboard-owner.spec.ts"
      - "package.json"
    verify:
      - "REB_DEV_UNGATED_ACCESS=1 REB_DEV_TENANT=gldf pnpm exec playwright test tests/dashboard-owner.spec.ts --project=desktop"
      - "REB_DEV_UNGATED_ACCESS=0 pnpm exec playwright test tests/smoke.spec.ts --project=desktop"
    stop_if:
      - "The test requires real Clerk credentials."
      - "The test requires production-only services."
      - "Need files outside allowed_files."
      - "Verification fails twice."
    receipt:
      result: done
      changed_files:
        - "tests/dashboard-owner.spec.ts"
        - "package.json"
      commands:
        - cmd: "PLAYWRIGHT_BASE_URL=http://localhost:3000 REB_DEV_UNGATED_ACCESS=1 REB_DEV_TENANT=gldf pnpm exec playwright test tests/dashboard-owner.spec.ts --project=desktop"
          status: pass
        - cmd: "PLAYWRIGHT_BASE_URL=http://localhost:3000 REB_DEV_UNGATED_ACCESS=0 pnpm exec playwright test tests/dashboard-owner.spec.ts --project=desktop"
          status: pass
          note: "Skipped as intended when dev access is off."
        - cmd: "pnpm typecheck"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Added a dedicated owner-dashboard smoke test for chat, reports, approvals, site editor, sources, settings, and assets under local dev access, plus a package script for that check."
      notes:
        - "Attempted `tests/smoke.spec.ts` against the existing localhost server with PLAYWRIGHT_BASE_URL; it failed on a pre-existing cron 500-vs-401 expectation for that ad hoc server, not on the new dashboard test."
