      - "Separate goal-owned files from unrelated dirty files."
    expected_output:
      - "Final gate plan"
      - "Blockers"
      - "Safe next Worker task if needed"
    receipt:
      result: done
      summary: "Resolved final smoke path: run `next start` from the already-built output on port 3200, then point Playwright at `PLAYWRIGHT_BASE_URL=http://localhost:3200` with dev access off. This avoids the existing Next dev-server lock on the repo."
      evidence:
        - "Existing Next dev server PID 61085 on port 3000"
        - "No listener on port 3100, but Next dev still refuses a second dev server for the repo"
        - "Production `next start --port 3200` ran successfully"
