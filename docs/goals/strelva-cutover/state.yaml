version: 2

goal:
  title: "Complete the Strelva Cutover: Tenant-Redesign Ready"
  slug: "strelva-cutover"
  kind: multi_repo_migration_goal
  tranche: "Move control plane + marketing + every tenant site onto Strelva; leave tenant repos redesign-ready."
  status: ready
  intake:
    original_request: "we have a web folder for repos and i want you to create a /goal of getting everything completed over to strelva so im set up to easily redesign tenant sites"
    interpreted_outcome: "One canonical Strelva control plane, marketing committed, and every tenant repo migrated to app.strelva.com and clean of scaffoldweb, building green, so redesigning a tenant is a fast repeatable task."
    input_shape: multi_repo_migration
    audience: "Jacob (operator) + coding agents"
    authority: requested
    proof_type: builds_green_and_live
    completion_proof: "Canonical control plane live on app.strelva.com; tenant repos build, point at app.strelva.com, and load on their own domains; redesign workflow documented."
    likely_misfire: "Renaming wire-level REB_*/reb:/x-reb-* (back-compat by design), or working in a stale reb copy."
    local_facts:
      - "Web folder: /Users/laneyfraass/websites/."
      - "Canonical control plane = ~/REB (has src/lib/brand.ts, Strelva rebrand, newest 2026-06-02, branch redesign/strelva-two-division); NOT inside the web folder."
      - "Stale duplicates: websites/reb (scaffold-web, no brand.ts, 43 scaffoldweb refs) and websites/reb-launch-readiness-clean."
      - "websites/reb-contracts = @reb/contracts shared package."
      - "Tenants websites/gldf + websites/rohlax-wellness still use REB_API_URL/reb-contracts, zero strelva refs (gldf all REB_; rohlax partial REB_+SCAFFOLD_)."
      - "~/strelva-marketing redesign builds green but is uncommitted."
      - "Control-plane rename ~done; remnants: 7 stale smoke assertions + dead brand.ts. Infra cutover (Clerk/Resend/Stripe/DNS) not done. Plan: docs/strelva-migration-plan.md."
      - "Keep wire-level REB_* names / reb: prefixes / x-reb-* headers (intentional back-compat); change values + brand copy only."

rules:
  preserve_existing_work: true
  verify_each_repo_builds_before_moving_on: true
  do_not_rename_wire_level_reb_symbols: true
  one_active_task: true
  no_completion_without_green_builds_and_live_cutover: true

